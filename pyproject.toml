[project]
name = "antenna-pattern-utils"
version = "0.1.0"
description = "Convert, audit, repair, compare, and plot antenna pattern files."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Colin White" },
]
dependencies = [
    "matplotlib>=3.10",
]

[dependency-groups]
dev = [
    "ruff>=0.12",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
